<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>チェックインカウンター｜Overseas Business Manegement Department</title>
<style>
:root{
  --stock:#e9efe4; --stock-2:#dbe4d3; --ink:#1b3a5c; --ink-soft:#5f7a95;
  --stamp:#b4372c; --board:#10161b; --amber:#f0a73b; --rule:#b4c3a8; --go:#28c76f;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"MS Gothic",monospace;
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--jp);background:var(--board);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overflow:hidden}

/* ── 上部案内板（時計＋係員用プリンター接続） ── */
.board{background:var(--board);color:var(--amber);font-family:var(--mono);
  display:flex;align-items:center;gap:1rem;padding:.6rem clamp(1rem,3vw,2.5rem);
  border-bottom:2px solid #2a3540;letter-spacing:.12em;font-size:clamp(.68rem,1.4vw,.92rem)}
.board .plane{font-size:1.4em}
.board .div-name{color:#fff;letter-spacing:.24em;font-weight:700}
.board .spacer{flex:1}
.board .clock{font-variant-numeric:tabular-nums;font-size:1.2em;color:#fff}
.board .pstat{display:flex;align-items:center;gap:.5em;font-size:.9em}
.pdot{width:.7em;height:.7em;border-radius:50%;background:var(--stamp);box-shadow:0 0 6px var(--stamp)}
.pdot.on{background:var(--go);box-shadow:0 0 6px var(--go)}
.pbtn{background:transparent;border:1px solid #3c4a57;color:#8ea3b5;font-family:var(--jp);
  font-size:.9em;border-radius:5px;padding:.3em .8em;cursor:pointer}
.pbtn.amber{border-color:var(--amber);color:var(--amber)}
.pbtn.stop{border-color:var(--stamp);color:#ff8a7a}
.pbtn.on{border-color:var(--go);color:var(--go)}

main{height:calc(100% - 3rem);
  background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(27,58,92,.025) 3px 4px),var(--stock);
  display:flex;flex-direction:column;overflow:hidden}
.step{display:none;flex:1;flex-direction:column;padding:clamp(.8rem,2vh,1.6rem) clamp(1rem,3vw,2.5rem);
  gap:clamp(.6rem,1.6vh,1.2rem);min-height:0}
body[data-step="1"] #s1{display:flex}

.prompt{font-size:clamp(1.3rem,3.4vh,2.2rem);font-weight:800;letter-spacing:.06em;
  display:flex;align-items:baseline;gap:.8em}
.prompt .en{font-family:var(--mono);font-size:.44em;letter-spacing:.24em;color:var(--ink-soft);font-weight:400}

.namebox{background:#fff;border:2px solid var(--ink);border-radius:3px;padding:.5rem .9rem;
  display:flex;align-items:center;gap:.1em;min-height:clamp(3.2rem,9vh,5rem);position:relative}
.namebox::before{content:"PASSENGER NAME";position:absolute;top:-.62em;left:.8em;background:#fff;
  padding:0 .4em;font-family:var(--mono);font-size:clamp(.52rem,1.3vh,.68rem);letter-spacing:.2em;color:var(--ink-soft)}
.cell{font-size:clamp(1.6rem,6.5vh,3.4rem);font-weight:800;line-height:1.1;min-width:1.05em;text-align:center}
.cell.ph{color:#c9d4c2}
.caret{width:3px;height:clamp(1.6rem,6vh,3.2rem);background:var(--stamp);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.kbd{flex:1;min-height:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(5,1fr);gap:clamp(3px,.7vh,7px)}
.key{background:var(--board);color:var(--amber);border:0;border-radius:4px;font-family:var(--jp);font-weight:700;
  font-size:clamp(1.1rem,4.4vh,2.4rem);cursor:pointer;transition:transform .06s,background .06s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.45)}
.key:active{transform:translateY(2px);background:#26313b;box-shadow:none}
.key.blank{background:transparent;box-shadow:none;pointer-events:none}

.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(3px,.7vh,7px);height:clamp(3rem,8vh,4.6rem)}
.tool{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:4px;font-family:var(--jp);
  font-weight:800;font-size:clamp(.85rem,2.6vh,1.5rem);cursor:pointer}
.tool:active{background:var(--stock-2)}
.tool.warn{border-color:var(--stamp);color:var(--stamp)}

.actions{display:flex;gap:.8rem;align-items:stretch}
.go{flex:1;background:var(--stamp);color:#fff;border:0;border-radius:4px;font-family:var(--jp);font-weight:800;
  letter-spacing:.1em;font-size:clamp(1.1rem,3.2vh,1.9rem);padding:.6em 1em;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.28)}
.go:active{transform:translateY(2px);box-shadow:none}
.go[disabled]{background:#c3ceba;color:#8d9a85;box-shadow:none;cursor:default}

/* ── 名前入力（物理キーボード） ── */
.nameinput{
  width:100%;background:#fff;border:2px solid var(--ink);border-radius:4px;
  color:var(--ink);font-family:var(--jp);font-weight:800;
  font-size:clamp(2rem,7vh,3.4rem);padding:.4em .6em;text-align:center;
}
.nameinput:focus{outline:3px solid var(--stamp);outline-offset:2px}
.nameinput::placeholder{color:#c9d4c2;font-weight:600;font-size:.5em}
.inhint{color:var(--ink-soft);font-size:clamp(.85rem,2vh,1.05rem);line-height:1.7;text-align:center}
.inhint b{color:var(--ink)}

/* ── 発券アニメーション（オーバーレイ） ── */
.fx{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 30%,#16202b 0%,#0b0f14 70%);color:#fff;gap:1.6rem;text-align:center}
.fx.show{display:flex}
.fx h2{font-size:clamp(1.4rem,5vw,2.4rem);font-weight:800;letter-spacing:.08em}
.fx .msg{font-family:var(--mono);letter-spacing:.16em;color:var(--amber);font-size:clamp(.8rem,2.6vw,1.05rem)}
.fx .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fx .confetti i{position:absolute;top:-8%;width:11px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(120vh) rotate(720deg)}}

/* プリンター機体＋下から出てくるレシート */
.printing{display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.machine{position:relative;width:min(72vw,300px)}
.slot{position:relative;height:clamp(120px,26vh,220px);overflow:hidden;display:flex;justify-content:center}
.paper{
  width:74%;background:#fff;border-radius:3px 3px 5px 5px;
  padding:14px 10px 10px;display:flex;flex-direction:column;gap:9px;align-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  transform:translateY(-100%);animation:emit .7s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes emit{0%{transform:translateY(-100%)}100%{transform:translateY(0)}}
.paper .pline{height:7px;width:86%;background:#c9d2d8;border-radius:2px}
.paper .pline.s1{width:60%;height:12px;background:#243b55}
.paper .pline.s2{width:44%;background:#e0dcd0}
.paper .pqr{width:74px;height:74px;margin:4px 0;border-radius:4px;
  background:
   linear-gradient(#243b55 0 0) 0 0/16px 16px no-repeat,
   linear-gradient(#243b55 0 0) 100% 0/16px 16px no-repeat,
   linear-gradient(#243b55 0 0) 0 100%/16px 16px no-repeat,
   repeating-linear-gradient(90deg,#243b55 0 5px,#fff 5px 10px),
   repeating-linear-gradient(0deg,#243b55 0 5px,#fff 5px 10px);
  background-blend-mode:multiply;border:3px solid #fff;outline:2px solid #243b55}
.machine .body{
  margin-top:-6px;background:linear-gradient(#2a3540,#1a232b);border-radius:8px;
  padding:14px 0 16px;font-family:var(--mono);letter-spacing:.2em;color:#8ea3b5;font-size:.8rem;
  border:1px solid #3c4a57;position:relative;z-index:2}
.machine .body .lamp{display:inline-block;width:.6em;height:.6em;border-radius:50%;
  background:var(--go);box-shadow:0 0 8px var(--go);animation:blink 1s steps(2) infinite;vertical-align:middle;margin-right:.4em}
.slot::before{content:"";position:absolute;left:8%;right:8%;top:0;height:14px;z-index:3;
  background:linear-gradient(#1a232b,#2a3540);border-radius:4px;border:1px solid #3c4a57}

/* 完了（行き先は出さない＝シークレット） */
.fx .done{display:none;flex-direction:column;align-items:center;gap:.8rem}
.fx.done-mode .printing{display:none}
.fx.done-mode .done{display:flex}
.fx .done .tick{font-size:clamp(3.2rem,15vw,6rem);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.fx .done .to{font-size:clamp(1.6rem,7vw,2.8rem);font-weight:800}
.fx .done .greet{font-size:clamp(1.2rem,5vw,1.9rem);color:var(--amber);font-weight:800}
.fx .done .take{font-family:var(--mono);color:#9fb4c7;letter-spacing:.1em;font-size:clamp(.75rem,2.4vw,.95rem);margin-top:.4rem}
.fx .done .next{margin-top:1.2rem;background:var(--go);color:#052012;border:0;border-radius:10px;
  font-family:var(--jp);font-weight:800;font-size:1.15rem;padding:.8em 2.2em;cursor:pointer}
.fx .done .auto{font-family:var(--mono);color:#5f7a95;font-size:.8rem;letter-spacing:.1em;margin-top:.2rem}

.warn{position:fixed;left:0;right:0;bottom:0;background:var(--stamp);color:#fff;font-size:.82rem;
  padding:.5em 1em;text-align:center;z-index:30;line-height:1.5}
.warn[hidden]{display:none}

/* 係員用ログ（隠し。ダブルタップの隅で開く） */
.log{position:fixed;right:8px;bottom:8px;width:min(90vw,360px);max-height:40vh;overflow:auto;z-index:25;
  background:#05080a;border:1px solid #22323a;border-radius:8px;padding:8px;
  font-family:var(--mono);font-size:11px;color:#9fb4c7;line-height:1.6;white-space:pre-wrap;display:none}
.log.show{display:block}
.log b{color:var(--amber)} .log .e{color:#ff7a6b}
.loghandle{position:fixed;right:0;bottom:0;width:48px;height:48px;z-index:26;opacity:0}
</style>
</head>
<body data-step="1">

<div class="board">
  <span class="plane">✈</span>
  <span class="div-name">Overseas Business Manegement Department</span>
  <span class="spacer"></span>
  <span class="pstat"><span class="pdot" id="pdot"></span><span id="pstat">プリンター未接続</span></span>
  <button class="pbtn amber" id="connectBtn">接続</button>
  <button class="pbtn stop" id="abortBtn">■ 印刷停止</button>
  <span class="clock" id="clock">--:--</span>
</div>

<main>
  <section class="step" id="s1">
    <h1 class="prompt">お名前を にゅうりょく<span class="en">PASSENGER NAME</span></h1>
    <input class="nameinput" id="nameInput" type="text" maxlength="12"
           autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="なまえを入力して Enter">
    <p class="inhint">キーボードで名前を入力し、<b>Enter</b> または下のボタンで発券します。行き先はランダムで、券が出るまでナイショです。</p>
    <div class="actions">
      <button class="go" id="issueBtn" disabled>✈ とうじょうけんを 発券する</button>
    </div>
  </section>
</main>

<!-- 発券アニメーション（レシートが下からピーッと出る／行き先はシークレット） -->
<div class="fx" id="fx">
  <div class="confetti" id="fxConfetti"></div>

  <!-- 印刷中：プリンターからレシートが出てくる -->
  <div class="printing" id="fxPrinting">
    <div class="machine">
      <div class="slot"><div class="paper" id="paper">
        <div class="pline s1"></div><div class="pline"></div><div class="pline"></div>
        <div class="pqr"></div>
        <div class="pline"></div><div class="pline s2"></div>
      </div></div>
      <div class="body"><span class="lamp"></span> PT-210</div>
    </div>
    <h2 id="fxName">発券しています…</h2>
    <p class="msg" id="fxMsg">とうじょうけんを 印刷中</p>
  </div>

  <!-- 完了：行き先は出さない -->
  <div class="done" id="fxDone">
    <div class="tick">🎫</div>
    <p class="to">発券かんりょう！</p>
    <p class="greet">とうじょうけんを おわたしください</p>
    <p class="take">行き先は ゲートの読み取り機で わかります</p>
    <button class="next" id="nextBtn">つぎの人へ</button>
    <p class="auto" id="autoBack"></p>
  </div>
</div>

<div class="warn" id="warn" hidden></div>
<div class="loghandle" id="loghandle" title="ログ"></div>
<div class="log" id="log"></div>

<!-- 印刷用（画面に出さない） -->
<canvas id="ticket" width="384" height="10" style="display:none"></canvas>

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};

function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;

            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;

        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);

			} else if (v < 8) {

			} else {

			} else if (h < 9) {

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {

		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );

	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

var index = QRCode;


  var EC={L:QRErrorCorrectLevel.L,M:QRErrorCorrectLevel.M,Q:QRErrorCorrectLevel.Q,H:QRErrorCorrectLevel.H};
  function encode(text, ec){
    var lvl = EC[ec||"M"]; if(lvl===undefined) lvl=EC.M;
    var qr=new QRCode(-1, lvl);   // -1 = 自動で最小の型番を選ぶ
    /* このライブラリは1文字=1バイト前提のため、UTF-8バイト列を
       1バイト=1文字の「バイナリ文字列」に変換してから渡す。
       これで日本語（3バイト/文字）も正しくQR化される。 */
    var s = text==null ? "" : String(text);
    var bin = "";
    for(var k=0;k<s.length;k++){
      var cp = s.codePointAt(k);
      if(cp>0xffff) k++;
      if(cp<0x80){ bin+=String.fromCharCode(cp); }
      else if(cp<0x800){ bin+=String.fromCharCode(0xc0|(cp>>6),0x80|(cp&63)); }
      else if(cp<0x10000){ bin+=String.fromCharCode(0xe0|(cp>>12),0x80|((cp>>6)&63),0x80|(cp&63)); }
      else { bin+=String.fromCharCode(0xf0|(cp>>18),0x80|((cp>>12)&63),0x80|((cp>>6)&63),0x80|(cp&63)); }
    }
    qr.addData(bin);
    qr.make();
    var n=qr.getModuleCount();
    var mods=[];
    for(var r=0;r<n;r++){ mods[r]=[]; for(var c=0;c<n;c++){ mods[r][c]=qr.isDark(r,c)?1:0; } }
    return {modules:mods, size:n, version:qr.typeNumber};
  }
  function toSVG(text, opts){
    opts=opts||{}; var q=opts.quiet==null?4:opts.quiet;
    var r=encode(text, opts.ec||"M");
    var n=r.size, dim=n+q*2, d="";
    for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(r.modules[y][x]) d+="M"+(x+q)+" "+(y+q)+"h1v1h-1z";
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+dim+' '+dim+
      '" shape-rendering="crispEdges" role="img" aria-label="QRコード">'+
      '<rect width="'+dim+'" height="'+dim+'" fill="#ffffff"/>'+
      '<path d="'+d+'" fill="#000000"/></svg>';
  }
  return {encode:encode, toSVG:toSVG};
})();
if(typeof module!=="undefined") module.exports=TinyQR;
</script>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};

/* ═══════ 設定 ═══════ */
var CONFIG = {
  PASS_URL : "https://ken5yukita.github.io/Check-in/checkin-pass.html",

  {code:"KUL", city:"クアラルンプール", country:"マレーシア", flag:"🇲🇾", word:"スラマッ パギ", mean:"おはよう"},

];

var PRINTER_SERVICES = [
  "000018f0-0000-1000-8000-00805f9b34fb",
  "0000fee7-0000-1000-8000-00805f9b34fb",
  "49535343-fe7d-4ae5-8fa9-9fafd205e455"
];
var device=null, characteristic=null, useNoResponse=true;
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};

/* ── ログ ── */
function log(msg,mark){
  var el=$("log"), t=new Date().toLocaleTimeString("ja-JP",{hour12:false});
  el.innerHTML += (mark==="e"?'<span class="e">':(mark?"<b>":""))+"["+t+"] "+msg+(mark==="e"?"</span>":(mark?"</b>":""))+"\n";

tick(); setInterval(tick,10000);

if(!navigator.bluetooth){
  var w=$("warn"); w.hidden=false;

}

function setConnected(on){
  $("pdot").classList.toggle("on",on);

}
async function findWritable(server){
  var withResp=null, nrOnly=null;
  for(var i=0;i<PRINTER_SERVICES.length;i++){
    var su=PRINTER_SERVICES[i];
    try{
      var svc=await server.getPrimaryService(su);
      var chars=await svc.getCharacteristics();
      for(var j=0;j<chars.length;j++){
        var c=chars[j];
        /* 応答あり送信(write)ができる口を最優先。無ければ応答なしのみの口を控えに */
        if(c.properties.write && !withResp){ withResp=c; }
        else if(c.properties.writeWithoutResponse && !nrOnly){ nrOnly=c; }
      }
    }catch(_){}
  }
  var pick = withResp || nrOnly;
  if(!pick) throw new Error("書き込み可能なcharacteristicが見つかりません");
  useNoResponse = !withResp;
  log("書込経路: "+pick.uuid.slice(0,8)+" ["+(withResp?"応答あり可":"応答なしのみ")+"]");
  return pick;
}
$("connectBtn").addEventListener("click", async function(){
  if(device && device.gatt.connected){ device.gatt.disconnect(); return; }

  try{
    log("デバイス選択…");
    device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:PRINTER_SERVICES});
    device.addEventListener("gattserverdisconnected",function(){ setConnected(false); log("切断"); });
    var server=await device.gatt.connect();
    characteristic=await findWritable(server);

    log("接続成功（"+(useNoResponse?"WRITE_NR":"WRITE")+"）",true);
  }catch(err){
    log("接続エラー: "+err.message,"e");
    if(String(err.message).match(/permission|globally disabled|user gesture|SecurityError/i))
      log("→ https（GitHub Pages）で開いているか確認。file:// は不可。");
  }
});

/* ═══════ 名前入力（物理キーボード） ═══════ */
var state={name:""};
var nameInput=$("nameInput");

}
nameInput.addEventListener("input", syncName);

/* ═══════ 券のCanvas描画（丸ドットQR・現地語・AC 0806・時刻） ═══════ */
function isFinder(r,c,n){ return (r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7); }
function drawTicket(canvas, d){
  var W=CONFIG.PRINT_WIDTH, quiet=CONFIG.QUIET, ctx=canvas.getContext("2d");
  var qr=TinyQR.encode(d.qr||" ", CONFIG.EC);
  var n=qr.size, unit=n+quiet*2;
  /* QRは読み取りに十分な大きさを保ちつつ、送信量を抑えるため上限を設ける
     （1モジュール0.6mm以上あればスマホカメラで安定して読める） */
  var scale=Math.max(2, Math.min(5, Math.floor((W-40)/unit)));
  var qrTotal=unit*scale;

  var H = 250 + qrTotal + 58;   /* QR下：フッター文字＋切り取り線ぶんだけ */
  canvas.width=W; canvas.height=H;
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#000"; ctx.textBaseline="top";
  var cx=W/2;

  dash(ctx,16,14,W-16);
  ctx.textAlign="left";
  ctx.font="700 24px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif";
  ctx.fillText("とうじょうけん",20,30);
  ctx.textAlign="right";
  ctx.font="600 15px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif";
  ctx.fillText("✈ かぞくの ひ",W-20,38);
  ctx.textAlign="left";
  ctx.font="13px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif";
  ctx.fillText("しゃいんかぞく けんがくかい",20,60);
  hr(ctx,20,84,W-20);

  ctx.font="12px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif"; ctx.fillText("おなまえ",20,94);
  ctx.font="700 32px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif";
  ctx.fillText((d.name||"")+" さん",20,110);

  // びんめい / いきさき / じかん（受付番号なし）
  var cols=[["びんめい",CONFIG.FLIGHT],["いきさき",d.code],["じかん",d.time]];
  var colW=(W-40)/3;
  ctx.font="12px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif";
  cols.forEach(function(c,i){ctx.fillText(c[0],20+i*colW,158);});
  ctx.font="700 22px system-ui,sans-serif";
  cols.forEach(function(c,i){ctx.fillText(c[1],20+i*colW,176);});
  hr(ctx,20,212,W-20);

  // いきさき（QRの上）※現地語あいさつは印字しない
  ctx.textAlign="center";
  ctx.font="700 22px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif";
  ctx.fillText(d.city+"（"+d.country+"）ゆき",cx,222);
  ctx.textAlign="left";

  // QR：確実に読める四角モジュール。座標・サイズを整数に丸めてにじみ/ズレを防ぐ
  var oy=250, ox=Math.round((W-qrTotal)/2);
  for(var r=0;r<n;r++)for(var c=0;c<n;c++){
    if(!qr.modules[r][c]) continue;
    var px=Math.round(ox+(c+quiet)*scale), py=Math.round(oy+(r+quiet)*scale);
    var pw=Math.round(ox+(c+quiet+1)*scale)-px, ph=Math.round(oy+(r+quiet+1)*scale)-py;
    ctx.fillRect(px,py,pw,ph);
  }

  var fy=H-24;
  ctx.textAlign="center";
  ctx.font="700 15px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif";
  ctx.fillText(CONFIG.FOOTER,cx,fy-20);
  ctx.textAlign="left";
  dash(ctx,16,fy,W-16);
}
function hr(ctx,x1,y,x2){ctx.fillRect(x1,y,x2-x1,2);}
function dash(ctx,x1,y,x2){for(var x=x1;x<x2;x+=12)ctx.fillRect(x,y,7,2);}

/* ═══════ Canvas → ESC/POS ラスター → BLE ═══════ */
function canvasToRasterBands(canvas,opt){
  opt=opt||{}; var threshold=opt.threshold||170, band=opt.band||64;   // 64行=実績のある安全値。境界が減り文字の見切れも減る
  var W=canvas.width,H=canvas.height;
  var data=canvas.getContext("2d").getImageData(0,0,W,H).data;
  var bpr=Math.ceil(W/8), bands=[];
  for(var y0=0;y0<H;y0+=band){
    var bh=Math.min(band,H-y0), raster=new Uint8Array(bpr*bh);
    for(var y=0;y<bh;y++)for(var x=0;x<W;x++){
      var i=((y0+y)*W+x)*4, a=data[i+3];
      var lum=a===0?255:(data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114);
      if(lum<threshold) raster[y*bpr+(x>>3)] |= (0x80>>(x&7));
    }
    var head=Uint8Array.from([0x1D,0x76,0x30,0x00,bpr&0xff,(bpr>>8)&0xff,bh&0xff,(bh>>8)&0xff]);
    var cmd=new Uint8Array(head.length+raster.length); cmd.set(head,0); cmd.set(raster,head.length);
    bands.push(cmd);
  }
  return bands;
}
/* ── 送信：ESC/POSの画像データは1バイトも欠けてはいけない ──
   ・必ず「応答あり送信(writeValue)」を使う。受領を待つので取りこぼしが起きない。
     （応答なし送信は流量制御が無く、黙ってパケットが捨てられて画像が壊れる）
   ・iOS(Bluefy)は properties が正しく取れないことがあるので、
     writeValue が存在すれば無条件でそちらを使う。
   ・チャンクはiOSでは20バイト（BLE最小MTUに収まり分割事故が起きない）
   ・失敗が続いたら、壊れた印刷を続けずに中断する                        */
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
             (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1) ||
             /Bluefy/i.test(navigator.userAgent);
/* iOS(Bluefy)は分割事故を避けて20バイト。
   Android/PCは180バイト（実績あり）。
   ※512や320は書き込みが「成功」と返るのにデータが欠けることがあり、
     エラーにならないまま文字化けするので使わない。 */
var CHUNK_STEPS = IS_IOS ? [20] : [180, 60, 20];
var TX = { chunk: CHUNK_STEPS[0] };
var txWithResp = true;
var printing = false;        // 二重印刷ガード

async function rawWrite(slice){
  /* writeValue（応答あり）が使えるなら必ずそれを使う */
  if(txWithResp && characteristic.writeValue) return characteristic.writeValue(slice);
  if(characteristic.writeValueWithoutResponse) return characteristic.writeValueWithoutResponse(slice);
  return characteristic.writeValue(slice);
}
async function sendBytes(bytes){
  var chunk = TX.chunk;
  for(var i=0;i<bytes.length;i+=chunk){
    if(!printing) throw new Error("中断されました");     /* 緊急停止に反応 */
    var slice=bytes.subarray(i, i+chunk);
    var attempt=0;
    while(true){
      try{ await rawWrite(slice); break; }
      catch(e){
        attempt++;
        if(attempt>=4){
          log("送信失敗（"+(e.message||e)+"）→ 印刷を中断します","e");
          throw e;                      /* 続けると文字化けするので中断 */
        }
        log("再送"+attempt+"（"+(e.message||e)+"）","e");
        await sleep(60*attempt);         /* 同じ塊を同じ方式で送り直す */
      }
    }
  }
}
var ESC_INIT=Uint8Array.from([0x1B,0x40]), FEED=Uint8Array.from([0x0A,0x0A,0x0A,0x0A]);

/* 緊急停止：プリンターを初期化して暴走を止める */
async function abortPrint(){
  printing=false;
  try{
    if(characteristic){
      /* ESC @ を単独で送り、受信中の画像コマンドを打ち切って初期化 */
      for(var k=0;k<3;k++){
        try{ await rawWrite(ESC_INIT); }catch(_){}
        await sleep(40);
      }
      log("プリンターを初期化しました（停止）",true);
    }
  }catch(e){ log("停止コマンド失敗: "+(e.message||e),"e"); }
}

async function printCanvas(canvas){
  if(!characteristic){ log("未接続のため印刷スキップ","e"); return false; }
  if(printing){ log("印刷中のため無視しました","e"); return false; }
  /* 方式を確定。iOSでは properties が空のことがあるため writeValue の有無で判断 */
  txWithResp = !!(characteristic.write || characteristic.writeValue);
  if(characteristic.properties && characteristic.properties.write===false
     && characteristic.properties.writeWithoutResponse===true){
    txWithResp = false;
  }
  var bands=canvasToRasterBands(canvas);

  /* 大きいチャンクから試し、失敗したら小さくして最初からやり直す */
  for(var s=0; s<CHUNK_STEPS.length; s++){
    TX.chunk = CHUNK_STEPS[s];
    printing = true;
    log("印刷開始（"+bands.length+"バンド／"+(txWithResp?"応答あり":"応答なし")+"送信／chunk"+TX.chunk+(IS_IOS?" iOS":"")+"）");
    try{
      await sendBytes(ESC_INIT);
      for(var b=0;b<bands.length;b++){ await sendBytes(bands[b]); }
      await sendBytes(FEED);
      printing=false;
      log("印刷送出 完了",true);
      return true;
    }catch(e){
      printing=false;
      if(String(e && e.message).indexOf("中断")>=0){ log("停止しました","e"); return false; }
      if(s < CHUNK_STEPS.length-1){
        log("chunk"+TX.chunk+"で失敗 → chunk"+CHUNK_STEPS[s+1]+"で再試行","e");
        await sleep(200);
      }else{
        log("印刷を中断しました（用紙を捨てて再発券してください）","e");
        return false;
      }
    }
  }
  return false;
}

/* ═══════ 発券フロー（アニメ→印刷→完了画面） ═══════ */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }

function confettiBurst(){
  var c=$("fxConfetti"); c.innerHTML="";
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cols=["#f0a73b","#e0572c","#3aa76d","#3a6ea5","#e8b4c8","#f5d547"];
  for(var i=0;i<28;i++){var p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%"; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.5+Math.random()*1.4)+"s"; p.style.animationDelay=(Math.random()*0.3)+"s";
    if(i%2)p.style.borderRadius="50%"; c.appendChild(p);}
}

async function issue(){
  if(!state.name) return;
  clearTimeout(reset._t);
  var d=pick(DESTS);
  var seat=(Math.floor(Math.random()*30)+1)+"ABCDEF".charAt(Math.floor(Math.random()*6));
  // QRはASCIIのみ（名前は%エンコード）：カメラアプリの文字コード誤解釈を防ぐ
  // 座席・便名は入れない（券に印字するのみ）＝QRを小さく保つ
  var url=CONFIG.PASS_URL+"#n="+encodeURIComponent(state.name)+"&d="+d.code;
  var ticketData={name:state.name, code:d.code, city:d.city, country:d.country, time:nowHM(), qr:url};

  // 券を（画面に出さず）裏で描画
  try{ drawTicket($("ticket"), ticketData); }catch(e){ log("券の描画失敗: "+e.message,"e"); }

  // 印刷中アニメ：レシートが下からピーッ（行き先は一切出さない＝シークレット）
  var fx=$("fx"); fx.classList.remove("done-mode"); fx.classList.add("show");
  // paper のアニメを毎回頭から流す
  var paper=$("paper"); paper.style.animation="none"; void paper.offsetWidth; paper.style.animation="";
  $("fxName").textContent = state.name+" さん、発券しています…";
  var msgs=["とうじょうけんを 印刷中","QRコードを 印刷中","もうすぐ できあがり"];
  var mi=0; $("fxMsg").textContent=msgs[0];
  var msgTimer=setInterval(function(){ mi=(mi+1)%msgs.length; $("fxMsg").textContent=msgs[mi]; }, 700);

  // 印刷（接続時のみ）とアニメを並行
  var printP = printCanvas($("ticket")).catch(function(e){ log("印刷エラー: "+e.message,"e"); return false; });
  await Promise.all([ printP, sleep(CONFIG.ANIM_MS) ]);
  clearInterval(msgTimer);

  // 完了画面：行き先は出さない（＝ゲートの読み取り機でのお楽しみ）
  confettiBurst();
  fx.classList.add("done-mode");

  // 数秒で自動的に入力へ戻る（ボタンでも戻れる）
  var sec=8;
  $("autoBack").textContent="（"+sec+"秒で つぎの人へ）";
  clearInterval(issue._c);
  issue._c=setInterval(function(){ sec--; $("autoBack").textContent = sec>0 ? "（"+sec+"秒で つぎの人へ）":""; if(sec<=0) clearInterval(issue._c); },1000);
  reset._t=setTimeout(reset, sec*1000);
}
function reset(){
  clearTimeout(reset._t); clearInterval(issue._c);
  state.name="";
  nameInput.value=""; $("issueBtn").disabled=true;
  $("fx").classList.remove("show","done-mode");
  $("fxConfetti").innerHTML="";
  try{ nameInput.focus(); }catch(_){}
}
$("issueBtn").addEventListener("click", issue);
$("nextBtn").addEventListener("click", reset);
$("abortBtn").addEventListener("click", function(){
  abortPrint();
  $("fx").classList.remove("show","done-mode");
});

/* 誤操作抑制（入力欄では右クリック等は許可） */
document.addEventListener("contextmenu",function(e){ if(e.target!==nameInput) e.preventDefault(); });

syncName();
})();
</script>
</body>
</html>
