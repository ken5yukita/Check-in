<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10161b">
<!-- ホーム画面に追加すると、アドレスバー・ツールバーの無い全画面で起動する -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スキャナー">
<title>とうじょうけん スキャナー｜海外事業部</title>
<style>
:root{
  --board:#10161b;
  --board-2:#1a232b;
  --amber:#f0a73b;
  --amber-soft:#8a6a34;
  --ink-soft:#8ea3b5;
  --stamp:#b4372c;
  --ok:#3fae6b;
  --stock:#e9efe4;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"MS Gothic",monospace;
  /* Mac→Hiragino、Windows→メイリオ優先（游ゴシックは太字が細く潰れるため後ろに回す） */
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo","Noto Sans JP","Yu Gothic Medium","Yu Gothic","MS PGothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}   /* dvh=バーの有無に追従する実際の表示高さ */
body{
  font-family:var(--jp);background:var(--board);color:var(--amber);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overflow:hidden;touch-action:manipulation;
}

/* ── 上部の案内板ストリップ ── */
.top{
  position:fixed;top:0;left:0;right:0;z-index:5;
  background:var(--board);border-bottom:2px solid var(--amber);
  font-family:var(--mono);letter-spacing:.2em;
  padding:.7rem clamp(1rem,4vw,1.6rem);
  display:flex;align-items:center;gap:.8rem;
  font-size:clamp(.66rem,2.6vw,.85rem);
  padding-top:calc(.7rem + env(safe-area-inset-top));
}
.top .plane{font-size:1.5em}
.top b{color:#fff;letter-spacing:.28em}
.top .spacer{flex:1}
.top .count{color:var(--ink-soft)}
.top .count b{color:var(--amber)}

/* ── 画面共通 ── */
.screen{position:fixed;inset:0;display:none;flex-direction:column}
body[data-view="idle"] #idle,
body[data-view="scan"] #scan,
body[data-view="error"] #error{display:flex}

/* ── アイドル画面 ── */
#idle{align-items:center;justify-content:center;text-align:center;padding:2rem;gap:2rem}
#idle .mark{font-size:clamp(3rem,18vw,6rem);line-height:1}
#idle h1{font-size:clamp(1.5rem,7vw,2.6rem);font-weight:800;letter-spacing:.04em;color:#fff}
#idle p{color:var(--ink-soft);font-size:clamp(.85rem,3.6vw,1.05rem);line-height:1.9;max-width:22rem}
.start{
  background:var(--stamp);color:#fff;border:0;border-radius:6px;
  font-family:var(--jp);font-weight:800;letter-spacing:.08em;
  font-size:clamp(1.15rem,5vw,1.6rem);padding:1em 2.4em;cursor:pointer;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);
}
.start:active{transform:translateY(2px);box-shadow:none}
.start:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* ── スキャン画面 ── */
#scan{background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.veil{position:absolute;inset:0;pointer-events:none}
/* ファインダー枠 */
.finder{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(72vw,72vh,420px);aspect-ratio:1;
}
.finder span{position:absolute;width:16%;height:16%;border:4px solid var(--amber)}
.finder .tl{top:0;left:0;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.finder .tr{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.finder .bl{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 6px}
.finder .br{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 6px 0}
.finder.hit span{border-color:var(--ok);transition:border-color .1s}
.hint{
  position:absolute;left:0;right:0;bottom:calc(2rem + env(safe-area-inset-bottom));
  text-align:center;font-family:var(--mono);letter-spacing:.16em;
  color:#fff;font-size:clamp(.72rem,3vw,.95rem);text-shadow:0 1px 4px #000;
}
.stopbtn{
  position:absolute;top:calc(3.4rem + env(safe-area-inset-top));right:1rem;
  background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.4);
  border-radius:20px;font-family:var(--jp);font-size:.82rem;padding:.4em 1em;cursor:pointer;
}

/* ── 読み取り結果オーバーレイ（子供向けの明るい画面） ── */
.result{
  position:absolute;inset:0;z-index:6;display:none;cursor:pointer;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(1rem,4vw,2rem);
  /* 空港の朝焼けのような やわらかいグラデーション */
  background:
    radial-gradient(120% 90% at 50% 0%, #fff3d6 0%, #ffe1b0 32%, #ffd0e0 66%, #d9e8ff 100%);
  animation:pop .32s cubic-bezier(.2,1.2,.35,1);
}
.result.show{display:flex}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* ふわっと立ち上がるカード */
.rcard{
  background:#fff;border-radius:26px;
  padding:clamp(1.2rem,4.5vw,2.4rem) clamp(1.2rem,5vw,2.6rem);
  box-shadow:0 18px 50px rgba(180,120,60,.28);
  max-width:min(92vw,640px);width:100%;
  display:flex;flex-direction:column;align-items:center;gap:clamp(.5rem,1.6vh,1rem);
  animation:rise .42s cubic-bezier(.2,1.3,.35,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

.rflag{font-size:clamp(3.4rem,15vw,6rem);line-height:1;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

.rwelcome{
  font-family:var(--jp);font-weight:800;color:var(--stamp);
  font-size:clamp(1.1rem,4.4vw,1.7rem);letter-spacing:.06em;
}
.rname{
  font-family:var(--jp);font-weight:800;color:#243b55;line-height:1.15;
  font-size:clamp(1.9rem,9vw,3.4rem);
  animation:namepop .5s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes namepop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* 紙吹雪（券が読めたときだけ舞う） */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.confetti i{
  position:absolute;top:-8%;width:11px;height:16px;border-radius:2px;opacity:.95;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);opacity:1}
  100%{transform:translateY(112vh) rotate(720deg);opacity:1}
}

/* あいさつ＋日本語の意味 */
.greetbox{
  background:#fff7e6;border:2px dashed #f0a73b;border-radius:18px;
  padding:clamp(.7rem,3vw,1.2rem) clamp(1rem,4vw,1.8rem);
  width:100%;max-width:34rem;
}
.rgreet{
  font-family:var(--jp);font-weight:800;color:#e08a1e;line-height:1.2;
  font-size:clamp(1.6rem,7.5vw,2.8rem);
}
.rmean{
  font-family:var(--jp);color:#7a5a2a;margin-top:.35em;
  font-size:clamp(.95rem,4vw,1.35rem);font-weight:700;
}
.rmean::before{content:"＝ ";opacity:.7}
.rmean::after{content:" って いういみ";font-weight:400;opacity:.75;font-size:.8em}

.rcity{
  font-family:var(--jp);color:#3a6ea5;font-weight:800;
  font-size:clamp(1rem,4.6vw,1.5rem);
}
.rfun{
  font-family:var(--jp);color:#5a6b7a;line-height:1.6;
  font-size:clamp(.82rem,3.6vw,1.1rem);max-width:30rem;
}
.rfun::before{content:"💡 "}

.plainval{
  font-family:var(--mono);color:#243b55;font-size:clamp(.95rem,4.5vw,1.3rem);
  word-break:break-all;max-width:90%;line-height:1.5;
}

.result .rdismiss{
  position:absolute;left:0;right:0;bottom:calc(1.4rem + env(safe-area-inset-bottom));
  font-family:var(--jp);color:#a06a3a;letter-spacing:.06em;font-weight:700;
  font-size:clamp(.72rem,3vw,.95rem);
}

/* ── エラー画面 ── */
#error{align-items:center;justify-content:center;text-align:center;padding:2rem;gap:1.4rem}
#error .mark{font-size:4rem}
#error h2{color:#fff;font-size:1.4rem}
#error p{color:var(--ink-soft);line-height:1.9;max-width:24rem;font-size:.92rem}
#error code{background:var(--board-2);color:var(--amber);padding:.1em .5em;border-radius:3px;font-family:var(--mono);font-size:.85em}
.retry{background:transparent;border:2px solid var(--amber);color:var(--amber);border-radius:5px;font-family:var(--jp);font-weight:700;font-size:1rem;padding:.6em 1.6em;cursor:pointer}

/* ── 横画面（テレビ等へ16:9で出すとき） ────────────────
   高さ(vh)基準でサイズを決め、画面内に必ず収まるようにする。
   端末の高さに関わらず横向きなら常に発動させる。            */
@media (orientation:landscape){
  .result{padding:2vh 3vw}
  .rcard{
    max-width:min(96vw,1200px);width:100%;
    max-height:92vh;overflow:hidden;
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    grid-template-rows:auto auto auto auto;
    align-items:center;
    gap:.6vh clamp(1rem,3vw,2.4rem);
    padding:2.5vh clamp(1.2rem,3.5vw,2.6rem);
    border-radius:clamp(14px,2vh,26px);text-align:left;
  }
  /* 左：国旗を縦にまたいで大きく */
  .rflag{
    grid-column:1;grid-row:1/5;
    font-size:min(26vh,20vw);line-height:1;margin:0;
  }
  /* 右：上から ようこそ／なまえ／あいさつ／くに */
  .rwelcome{grid-column:2;grid-row:1;font-size:min(5vh,4vw);align-self:end;margin:0}
  .rname   {grid-column:2;grid-row:2;font-size:min(13vh,11vw);align-self:start;margin:0}
  .greetbox{
    grid-column:2;grid-row:3;width:auto;max-width:none;align-self:center;
    padding:1.6vh clamp(.8rem,2vw,1.6rem);border-radius:clamp(10px,1.6vh,18px);
  }
  .rgreet{font-size:min(8.5vh,7vw);line-height:1.15}
  .rmean {font-size:min(4vh,3.4vw);margin-top:.2em}
  .rmean::after{font-size:.75em}
  .rcity {grid-column:2;grid-row:4;font-size:min(4.4vh,3.8vw);align-self:start;margin:0}
  /* 豆知識は横画面では隠す（被り防止・遠くからは読めないため） */
  .rfun{display:none}
  .plainval{grid-column:1/3;font-size:min(3vh,3vw)}
  .rbadge{font-size:min(2.2vh,2.2vw)}
  .result .rdismiss{bottom:1vh;font-size:min(2vh,2vw)}
}

/* ── ホーム画面から起動した全画面モード（バーが消えた状態） ── */
@media (display-mode:standalone),(display-mode:fullscreen){
  .result .rdismiss{bottom:calc(1vh + env(safe-area-inset-bottom))}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-view="idle">

<div class="top">
  <span class="plane">✈</span>
  <b>BOARDING PASS SCANNER</b>
  <span class="spacer"></span>
  <span class="count">よみとり <b id="count">0</b></span>
</div>

<!-- ── アイドル ── -->
<section class="screen" id="idle">
  <div class="mark">🎫</div>
  <div>
    <h1>とうじょうけん<br>スキャナー</h1>
    <p>ボタンを おすと カメラが ひらきます。<br>とうじょうけんの QRコードを わくに あわせると、<br>「ピッ」と おとが なって いきさきが ひょうじされます。</p>
  </div>
  <button class="start" id="startBtn">スキャンを はじめる</button>
</section>

<!-- ── スキャン中 ── -->
<section class="screen" id="scan">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="frame" hidden></canvas>
  <div class="veil">
    <div class="finder" id="finder"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
    <p class="hint">QRコードを わくに あわせてね</p>
  </div>
  <button class="stopbtn" id="stopBtn">とじる</button>

  <div class="result" id="result">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="rcard" id="rCard">
      <div class="rflag" id="rFlag">🎫</div>
      <div class="rwelcome" id="rWelcome">ようこそ！</div>
      <div class="rname" id="rName"></div>
      <div class="greetbox" id="rGreetBox">
        <div class="rgreet" id="rGreet"></div>
        <div class="rmean" id="rMean"></div>
      </div>
      <div class="rcity" id="rCity"></div>
      <div class="rfun" id="rFun"></div>
      <div class="plainval" id="rPlain"></div>
    </div>
    <p class="rdismiss">つぎの人を よみとるか、画面を タップで けせます</p>
  </div>
</section>

<!-- ── エラー ── -->
<section class="screen" id="error">
  <div class="mark">📷</div>
  <h2 id="errTitle">カメラを つかえません</h2>
  <p id="errBody"></p>
  <button class="retry" id="retryBtn">もういちど ためす</button>
</section>

<!-- Safari/iOS でも動くQR読み取り。npmを直接ミラーする jsDelivr を第一候補にし、
     読み込めなかった場合は start() 側で別CDNを順に試す。 -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════
   ★ 設定
   ═══════════════════════════════════════════════════════════ */
var CONFIG = {
  ANNOUNCE_VOICE : true    // 音声で「◯◯行きへ ようこそ」と読み上げる（対応端末のみ）
  /* 結果は、次の人のQRを読むか、画面を1回タップして消すまで表示し続けます */
};

/* 行き先データ。word=現地のあいさつ、mean=その日本語の意味、flag=国旗、fun=ひとこと */
var DESTS = {
  HAN:{city:"ハノイ",           country:"ベトナム",     flag:"🇻🇳", word:"シン チャオ",       mean:"こんにちは",  fun:"おこめの めん「フォー」が おいしいよ"},
  PNH:{city:"プノンペン",       country:"カンボジア",   flag:"🇰🇭", word:"スオスダイ",         mean:"こんにちは",  fun:"大きな せきぞうの おてら「アンコールワット」が あるよ"},
  CGK:{city:"ジャカルタ",       country:"インドネシア", flag:"🇮🇩", word:"スラマッ シアン",   mean:"こんにちは",  fun:"しまが 1まん7せんも ある くにだよ"},
  MNL:{city:"マニラ",           country:"フィリピン",   flag:"🇵🇭", word:"クムスタ",           mean:"げんき？",    fun:"カラフルな のりあいバス「ジープニー」が はしるよ"},
  BKK:{city:"バンコク",         country:"タイ",         flag:"🇹🇭", word:"サワッディー",       mean:"こんにちは",  fun:"3りんの タクシー「トゥクトゥク」が ビュンビュン"},
  KUL:{city:"クアラルンプール", country:"マレーシア",   flag:"🇲🇾", word:"スラマッ パギ",     mean:"おはよう",    fun:"そらの上で はしが つながる ツインタワーが あるよ"},
  VTE:{city:"ビエンチャン",     country:"ラオス",       flag:"🇱🇦", word:"サバイディー",       mean:"こんにちは",  fun:"うみが ない くに。大きな メコンがわが ながれるよ"}
};
</script>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};

/* ── 状態 ── */
var audioCtx=null, detector=null, stream=null, scanning=false, mode="";
var canvas=null, cctx=null;
var shownValue="", count=0, rafId=null;

/* ══ 音：Web Audioで「ピッ」という短い確認音を合成 ══════
   外部の音声ファイルを使わないので、オフラインでも確実に鳴る。
   レジのスキャン音のような、みじかくて やさしい ピッ。 */
function unlockAudio(){
  if(!audioCtx){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audioCtx=new AC();
  }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
}
function chime(){
  if(!audioCtx) return;
  var t0=audioCtx.currentTime;
  /* 明るく上がる3音（ド・ミ・ソ）＝「タラリン♪」。最後の音は少し伸ばす。 */
  function note(freq, start, dur, peak){
    var t=t0+start;
    /* 主音（triangleで明るく、かつ耳ざわりでない） */
    var osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type="triangle"; osc.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+dur+0.02);
    /* 1オクターブ上を かすかに足して キラッと */
    var s=audioCtx.createOscillator(), sg=audioCtx.createGain();
    s.type="sine"; s.frequency.value=freq*2;
    sg.gain.setValueAtTime(0.0001,t);
    sg.gain.exponentialRampToValueAtTime(peak*0.22,t+0.008);
    sg.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.8);
    s.connect(sg).connect(audioCtx.destination);
    s.start(t); s.stop(t+dur+0.02);
  }
  /* ド(C6)→ミ(E6)→ソ(G6)。最後のソを長めに響かせる */
  note(1046.5, 0.00, 0.13, 0.30);
  note(1318.5, 0.10, 0.13, 0.30);
  note(1568.0, 0.20, 0.34, 0.34);
}
function announce(text){
  if(!CONFIG.ANNOUNCE_VOICE || !window.speechSynthesis) return;
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; u.rate=1.0; u.pitch=1.05;
    /* チャイムの余韻の後に喋らせる */
    setTimeout(function(){ window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }, 700);
  }catch(e){}
}

/* ══ QRの中身を搭乗券として解釈 ══════════════════════════ */
function parseTicket(raw){
  var i=raw.indexOf('#');
  var hash = i>=0 ? raw.slice(i+1) : '';
  var o={};
  /* 生・%エンコード・二重エンコードのどれで来ても読めるようにする */
  function dec(s){
    for(var t=0;t<3;t++){
      if(!/%[0-9A-Fa-f]{2}/.test(s)) break;
      try{ var d=decodeURIComponent(s); if(d===s) break; s=d; }catch(e){ break; }
    }
    return s;
  }
  hash.split('&').forEach(function(kv){
    var j=kv.indexOf('=');
    if(j<0) return;
    o[dec(kv.slice(0,j))]=dec(kv.slice(j+1));
  });
  if(!o.n || !DESTS[o.d]) return null;
  var d=DESTS[o.d];
  return {name:o.n, code:o.d, city:d.city, country:d.country, flag:d.flag,
          word:d.word, mean:d.mean, fun:d.fun, seat:o.s||'', flight:o.f||''};
}

/* ══ 検知時の演出 ══════════════════════════════════════ */
function handleHit(value){
  var t=$("finder"); t.classList.add("hit");
  setTimeout(function(){ t.classList.remove("hit"); }, 250);

  count++; $("count").textContent=count;
  chime();

  var r=$("result"), tk=parseTicket(value);
  if(tk){
    $("rFlag").textContent    = tk.flag || "🎫";
    $("rWelcome").textContent = "ようこそ！";
    $("rName").textContent    = tk.name + " さん";
    $("rGreet").textContent   = tk.word;
    $("rMean").textContent    = tk.mean;
    $("rCity").textContent    = tk.flag + " " + tk.city + "・" + tk.country + " ゆき";
    $("rFun").textContent     = tk.fun || "";
    /* 券用の項目を表示、QR素の値は隠す */
    ["rWelcome","rName","rGreetBox","rCity"].forEach(function(id){ $(id).style.display=""; });
    $("rFun").style.display = tk.fun ? "" : "none";
    $("rPlain").style.display = "none";
    announce(tk.city+"ゆきへ ようこそ、"+tk.name+"さん。"+tk.word+"。にほんごで、"+tk.mean+"。");
    burstConfetti();
  }else{
    /* 搭乗券以外のQRでも、鳴らして中身は出す */
    $("rFlag").textContent = "🔎";
    ["rWelcome","rName","rGreetBox","rCity","rFun"].forEach(function(id){ $(id).style.display="none"; });
    $("rPlain").style.display=""; $("rPlain").textContent=value;
    clearConfetti();
  }
  r.classList.add("show");   /* 次のQRを読むか、タップで消すまで表示し続ける */
  /* カードの登場アニメを毎回 再生（別の券に差し替わったときも動く） */
  var card=$("rCard");
  card.style.animation="none"; void card.offsetWidth; card.style.animation="";
}

/* 結果を手動で消す（次の人を待つ状態に戻す） */
function clearResult(){
  $("result").classList.remove("show");
  clearConfetti();
  shownValue="";
}

/* ══ 紙吹雪 ══════════════════════════════════════════ */
var CONFETTI_COLORS=["#f0a73b","#e0572c","#3aa76d","#3a6ea5","#e8b4c8","#f5d547"];
function clearConfetti(){ var c=$("confetti"); if(c) c.innerHTML=""; }
function burstConfetti(){
  var c=$("confetti"); if(!c) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  c.innerHTML="";
  var n=26;
  for(var i=0;i<n;i++){
    var p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%";
    p.style.background=CONFETTI_COLORS[i%CONFETTI_COLORS.length];
    p.style.animationDuration=(1.4+Math.random()*1.3)+"s";
    p.style.animationDelay=(Math.random()*0.25)+"s";
    p.style.transform="rotate("+(Math.random()*360)+"deg)";
    if(i%2) p.style.borderRadius="50%";   /* 丸と四角を混ぜる */
    c.appendChild(p);
  }
  /* 3秒後に片付け（表示は残す） */
  clearTimeout(burstConfetti._t);
  burstConfetti._t=setTimeout(clearConfetti, 3200);
}

/* ══ 1フレームからQRを読む（方式は mode で切替） ══════════
   mode="native" … BarcodeDetector（Chrome等・高速）
   mode="jsqr"   … jsQR（Safari/iOS含む全ブラウザ・canvas経由） */
function onValue(val){
  /* 今表示中のものと違うQRが来たときだけ、鳴らして差し替える。
     同じ券をかざし続けても二度鳴りしない。 */
  if(val && val!==shownValue){
    shownValue=val;
    handleHit(val);
  }
}
function scanNative(v){
  detector.detect(v).then(function(codes){
    if(codes && codes.length) onValue(codes[0].rawValue||"");
  }).catch(function(){/* 1フレームの失敗は無視 */});
}
function scanJsQR(v){
  var w=v.videoWidth, h=v.videoHeight;
  if(!w||!h) return;
  /* 負荷を抑えるため長辺640pxに縮小してから読む */
  var scale=Math.min(1, 640/Math.max(w,h));
  var cw=Math.round(w*scale), ch=Math.round(h*scale);
  if(canvas.width!==cw){ canvas.width=cw; canvas.height=ch; }
  cctx.drawImage(v,0,0,cw,ch);
  var img;
  try{ img=cctx.getImageData(0,0,cw,ch); }catch(e){ return; }
  var code=window.jsQR ? window.jsQR(img.data, cw, ch, {inversionAttempts:"dontInvert"}) : null;
  if(code && code.data) onValue(code.data);
}

/* ══ 検知ループ ══════════════════════════════════════ */
function loop(){
  if(!scanning) return;
  var v=$("video");
  if(v.readyState>=2 && v.videoWidth>0){
    if(mode==="native") scanNative(v);
    else                scanJsQR(v);
  }
  rafId=requestAnimationFrame(loop);
}

/* ══ jsQRを確実に読み込む（複数CDNを順に試す） ══════════ */
function loadScript(url){
  return new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=url; s.async=true;
    s.onload=function(){ res(); };
    s.onerror=function(){ rej(new Error("load fail")); };
    document.head.appendChild(s);
  });
}
function ensureJsQR(){
  if(window.jsQR) return Promise.resolve();
  var urls=[
    "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
    "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"
  ];
  var chain=Promise.reject();
  urls.forEach(function(url){
    chain=chain.catch(function(){
      if(window.jsQR) return;
      return loadScript(url).then(function(){ if(!window.jsQR) throw new Error("no global"); });
    });
  });
  return chain;
}

/* ══ カメラ起動 ══════════════════════════════════════ */
function showError(title, body){
  document.body.setAttribute("data-view","error");
  $("errTitle").textContent=title;
  $("errBody").innerHTML=body;
}
function beginLoop(){
  document.body.setAttribute("data-view","scan");
  scanning=true;
  if(CONFIG.ANNOUNCE_VOICE && window.speechSynthesis){ try{ window.speechSynthesis.getVoices(); }catch(e){} }
  loop();
}
function camError(err){
  var name=err && err.name || "";
  if(name==="NotAllowedError" || name==="SecurityError"){
    showError("カメラが きょかされていません",
      "ブラウザに カメラの しようを きょかしてから、もういちど おしてください。<br>"+
      "（iPhoneは 設定 → アプリ → Safari → カメラ で 許可できます）");
  }else if(name==="NotFoundError"){
    showError("カメラが みつかりません","この 端末で つかえる カメラが 見つかりませんでした。");
  }else if(name==="NotReadableError"){
    showError("カメラを つかえません","カメラが 別のアプリで つかわれている かもしれません。ほかのアプリを とじて ためしてください。");
  }else{
    showError("カメラを ひらけませんでした", (name||"エラー")+" が はっせいしました。");
  }
}

function start(){
  unlockAudio();

  if(!window.isSecureContext){
    showError("安全な接続が ひつようです",
      "カメラは <code>https://</code> または <code>localhost</code> でしか うごきません。<br>"+
      "GitHub Pages など https のURLから ひらいてください（ファイルを ダブルクリックして ひらいた場合は うごきません）。");
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showError("カメラを つかえません","この ブラウザは カメラに 対応していません。");
    return;
  }

  /* 読み取り方式：BarcodeDetectorがあれば高速なnative、無ければjsQR */
  var useNative = ("BarcodeDetector" in window);
  if(useNative){
    try{ detector=new window.BarcodeDetector({formats:["qr_code"]}); }
    catch(e){ try{ detector=new window.BarcodeDetector(); }catch(e2){ useNative=false; } }
  }

  /* カメラは タップ直後に すぐ起動（ジェスチャ内で呼ぶ）。
     jsQRの読み込みは これと 並行して 進める。 */
  var camReady = navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} },
    audio:false
  }).then(function(s){
    stream=s;
    var v=$("video");
    v.srcObject=s;
    v.setAttribute("playsinline","");
    return v.play();
  });

  if(useNative){
    mode="native";
    camReady.then(beginLoop).catch(camError);
    return;
  }

  /* jsQR方式：ライブラリ読み込みとカメラ起動の両方が そろってから開始 */
  mode="jsqr";
  canvas=$("frame");
  cctx=canvas.getContext("2d",{willReadFrequently:true});

  Promise.all([ camReady, ensureJsQR() ]).then(function(){
    beginLoop();
  }).catch(function(err){
    if(err && (err.name==="NotAllowedError"||err.name==="NotFoundError"||err.name==="SecurityError"||err.name==="NotReadableError")){
      camError(err);
    }else if(!window.jsQR){
      showError("QRの じゅんびに 失敗しました",
        "QR読み取り用の ファイルを 読み込めませんでした。<br>"+
        "通信環境を かえて（会場Wi-Fiや モバイル回線など）、もういちど ためしてください。");
    }else{
      camError(err);
    }
  });
}

function stop(){
  scanning=false;
  if(rafId) cancelAnimationFrame(rafId);
  if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
  $("video").srcObject=null;
  $("result").classList.remove("show");
  shownValue="";
  document.body.setAttribute("data-view","idle");
}

/* ── イベント ── */
$("startBtn").addEventListener("click", start);
$("retryBtn").addEventListener("click", function(){ document.body.setAttribute("data-view","idle"); });
$("stopBtn").addEventListener("click", stop);
$("result").addEventListener("click", clearResult);   /* 表示を手動で消す */
document.addEventListener("visibilitychange", function(){ if(document.hidden && scanning) stop(); });

/* iOSの拡大縮小・長押しを抑制 */
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
})();
</script>
